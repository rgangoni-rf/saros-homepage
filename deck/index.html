<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Saros: a plataforma de operações de T&amp;D que descobre, entende o padrão e recomenda o aprendizado de melhor desempenho.">
<meta property="og:title" content="Saros — Predição e impacto">
<meta property="og:description" content="Saros descobre, entende o padrão e recomenda o aprendizado de melhor desempenho.">
<meta property="og:url" content="https://sarosops.com/deck/">
<meta name="theme-color" content="#000000">
<title>Saros — Predição e impacto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#ff5b00;--orange-2:#f45100;--amber:#f78c00;--deep:#9e3500;
  --black:#000;--white:#fff;--azul:#eef3fb;--grafite:#4a5263;--gclaro:#c9d1de;
  --sub-l:#757575;--sub-d:#8a8a8a;--card-d:#141413;
  --ease:cubic-bezier(.2,.75,.15,1);
  --sans:"Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--sans);-webkit-font-smoothing:antialiased}
p,h1,h2,h3,ul{margin:0}
button{font-family:inherit}
#viewport{position:fixed;inset:0;background:#000}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;background:#000}

/* ---------- slides ---------- */
.slide{position:absolute;inset:0;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .7s var(--ease),visibility 0s linear .7s;color:var(--black);background:var(--white)}
.slide.on{opacity:1;visibility:visible;transition:opacity .7s var(--ease)}
.slide.dark{background:var(--black);color:var(--white)}
.slide.alt{background:var(--azul)}
.pad{position:absolute;left:160px;right:160px;top:176px;bottom:150px;display:flex;flex-direction:column}

.hd{position:absolute;left:160px;right:160px;top:64px;display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:400;color:var(--sub-l);letter-spacing:.01em}
.dark .hd{color:var(--sub-d)}
.hd .sec{display:flex;align-items:center;gap:14px}
.hd .sec::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--orange)}
.ft{position:absolute;left:160px;right:160px;bottom:56px;display:flex;align-items:center;gap:36px;color:var(--black)}
.dark .ft{color:var(--white)}
.ft .logo{height:26px;width:153px;flex:none}
.ft .legal{flex:1;font-size:18px;font-weight:300;color:var(--sub-l)}
.dark .ft .legal{color:var(--sub-d)}
.ft .pg{font-size:20px;font-weight:500;color:var(--sub-l);font-variant-numeric:tabular-nums}
.dark .ft .pg{color:var(--sub-d)}

.eyebrow{font-size:24px;font-weight:500;letter-spacing:.36em;text-transform:uppercase;color:var(--deep);margin-bottom:28px}
.dark .eyebrow{color:var(--orange)}
.kicker{font-size:24px;font-weight:500;letter-spacing:.42em;text-transform:lowercase;color:var(--orange)}
.h2{font-size:60px;font-weight:600;line-height:1.1;letter-spacing:-.03em;max-width:1500px}
.lead{font-size:34px;font-weight:300;line-height:1.35;color:var(--grafite);max-width:1300px;margin-top:24px}
.dark .lead{color:var(--gclaro)}
.hl{color:var(--orange)}

/* ---------- entrance animations (replay on each visit) ---------- */
[data-a]{opacity:0}
.in [data-a="rise"]{animation:rise 1s var(--ease) var(--d,0s) both}
.in [data-a="fade"]{animation:fade 1.2s var(--ease) var(--d,0s) both}
.in [data-a="log"]{animation:logIn .7s var(--ease) var(--d,0s) both}
.in [data-a="dash"]{animation:dashIn 1.3s var(--ease) var(--d,0s) both}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes logIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes dashIn{from{opacity:0;transform:translateY(90px)}to{opacity:1;transform:none}}

/* ---------- sky + eclipse (from the site hero) ---------- */
.sky{position:absolute;inset:0;pointer-events:none}
.stars{position:absolute;inset:-40%;background-image:radial-gradient(1px 1px at 12% 22%,rgba(255,255,255,.55),transparent 60%),radial-gradient(1px 1px at 72% 12%,rgba(255,255,255,.45),transparent 60%),radial-gradient(1.5px 1.5px at 38% 68%,rgba(255,255,255,.35),transparent 60%),radial-gradient(1px 1px at 88% 58%,rgba(255,255,255,.4),transparent 60%),radial-gradient(1px 1px at 52% 34%,rgba(255,255,255,.3),transparent 60%),radial-gradient(1px 1px at 22% 84%,rgba(255,255,255,.35),transparent 60%),radial-gradient(1.5px 1.5px at 64% 88%,rgba(255,255,255,.3),transparent 60%);background-size:620px 620px;animation:drift 90s linear infinite}
@keyframes drift{to{transform:translate3d(-620px,-620px,0)}}
.burst{position:absolute;left:50%;width:var(--D);height:var(--D);margin-left:calc(var(--D) / -2)}
.burst .sph{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 100%,#1b0b02 0%,#070606 30%,#000 60%)}
.burst .rim{position:absolute;inset:0;border-radius:50%;box-shadow:0 1.5px 0 0 rgba(255,226,204,.95),0 0 16px 2px rgba(255,140,60,.7),0 0 70px 8px rgba(255,91,0,.42),0 30px 220px 50px rgba(255,91,0,.2)}
.in .burst .rim{animation:rimIn 2s var(--ease) .15s both}
.burst .glare{position:absolute;left:50%;top:100%;width:44%;height:15%;transform:translate(-50%,-50%);background:radial-gradient(50% 50% at 50% 50%,#fffaf4 0%,rgba(255,196,140,.95) 9%,rgba(255,116,36,.6) 26%,rgba(255,91,0,.18) 50%,rgba(255,91,0,0) 72%);mix-blend-mode:screen}
.in .burst .glare{animation:glareIn 2.2s var(--ease) .25s both}
.burst .glare::after{content:"";position:absolute;left:-40%;right:-40%;top:50%;height:2px;margin-top:-1px;background:linear-gradient(90deg,rgba(255,200,160,0),rgba(255,236,220,.9) 50%,rgba(255,200,160,0))}
@keyframes rimIn{from{opacity:0}}
@keyframes glareIn{from{opacity:0;transform:translate(-50%,-50%) scale(.25)}}
.rays{position:absolute;left:50%;top:100%;width:0;height:0}
.ray{position:absolute;left:0;top:0;width:var(--l);height:var(--w);margin-top:calc(var(--w) / -2);border-radius:2px;transform-origin:0 50%;transform:rotate(var(--a)) translateX(var(--o));background:linear-gradient(90deg,rgba(255,242,230,.95),rgba(255,140,60,.75) 28%,rgba(255,91,0,.22) 70%,rgba(255,91,0,0));opacity:var(--op,.85)}
.in .ray{animation:rayIn 1.6s var(--ease) var(--d) both,rayPulse 6s ease-in-out var(--d2) infinite}
@keyframes rayIn{from{transform:rotate(var(--a)) translateX(var(--o)) scaleX(0);opacity:0}}
@keyframes rayPulse{50%{opacity:calc(var(--op,.85) * .45)}}
.ray i{position:absolute;top:50%;left:0;width:36px;height:2px;margin-top:-1px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);box-shadow:0 0 8px 1px rgba(255,180,120,.85);opacity:0;animation:pk var(--t) linear var(--d3) infinite}
@keyframes pk{0%{transform:translateX(0);opacity:0}10%{opacity:1}85%{opacity:.9}100%{transform:translateX(calc(var(--l) - 36px));opacity:0}}
.orb-ring{position:absolute;border-radius:50%;border:1px dashed rgba(201,209,222,.16);animation:orbspin 180s linear infinite}
.orb-ring.r1{inset:-4.5%}
.orb-ring.r2{inset:-10%;border-style:solid;border-color:rgba(201,209,222,.08);animation-duration:260s;animation-direction:reverse}
.orb-ring i{position:absolute;left:50%;bottom:-5px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--orange);box-shadow:0 0 14px rgba(255,91,0,.9)}
@keyframes orbspin{to{transform:rotate(360deg)}}

/* ---------- cover ---------- */
#s1 .burst{--D:2600px;top:330px;margin-top:-2600px}
#s1 .topbar{position:absolute;left:160px;right:160px;top:64px;display:flex;justify-content:space-between;align-items:center;color:#fff}
#s1 .topbar .logo{width:212px;height:36px}
#s1 .topbar span{font-size:22px;color:var(--sub-d)}
#s1 .hero{position:absolute;z-index:1;isolation:isolate;left:220px;right:220px;top:420px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:34px;color:#fff}
#s1 .hero::before{content:"";position:absolute;left:-10%;right:-10%;top:-80px;bottom:-60px;z-index:-1;background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.82) 0%,rgba(0,0,0,.6) 55%,rgba(0,0,0,0) 100%)}
#s1 h1{font-size:62px;line-height:1.08;letter-spacing:-.035em;font-weight:700;max-width:1440px}
#s1 .sub{font-size:30px;line-height:1.45;font-weight:300;color:var(--gclaro);max-width:1180px}
.marquee{position:absolute;left:0;right:0;bottom:56px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.marquee-track{display:flex;gap:56px;width:max-content;animation:marq 48s linear infinite}
.marquee-track span{display:flex;align-items:center;gap:18px;font-size:22px;color:var(--gclaro);white-space:nowrap}
.marquee-track span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 10px rgba(255,91,0,.8)}
@keyframes marq{to{transform:translateX(-50%)}}

/* ---------- cards ---------- */
.cards{display:grid;gap:28px}
.card{background:var(--azul);border-radius:16px;padding:40px 36px;display:flex;flex-direction:column;gap:18px;position:relative}
.alt .card{background:var(--white)}
.dark .card{background:var(--card-d);box-shadow:inset 0 1px 0 0 rgba(255,255,255,.14)}
.card .n{font-size:20px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--deep)}
.dark .card .n{color:var(--orange)}
.card h3{font-size:34px;font-weight:600;line-height:1.18;letter-spacing:-.015em}
.card .t{font-size:25px;line-height:1.45;color:var(--grafite)}
.dark .card .t{color:var(--gclaro)}

/* signals */
#s2 .cards{grid-template-columns:repeat(4,1fr);margin-top:48px}
#s2 .card h3{font-size:30px}
#s2 .card .t{font-size:23px}
.sig{position:absolute;right:36px;top:44px;width:12px;height:12px;border-radius:50%;background:var(--orange)}
.in .sig{animation:ping 1.8s ease-out var(--d,0s) infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,91,0,.7)}80%,100%{box-shadow:0 0 0 14px rgba(255,91,0,0)}}
.pattern{margin-top:40px;display:flex;align-items:center;gap:28px}
.pattern svg{flex:1;min-width:400px;height:24px;overflow:visible}
.pattern .base{stroke:var(--gclaro);stroke-width:2}
.pattern .pulse{stroke:var(--orange);stroke-width:3;stroke-linecap:round;stroke-dasharray:70 2000;stroke-dashoffset:70;filter:drop-shadow(0 0 6px rgba(255,91,0,.6))}
.in .pattern .pulse{animation:sigPulse 2.6s cubic-bezier(.45,0,.55,1) 1.4s infinite}
@keyframes sigPulse{from{stroke-dashoffset:70}to{stroke-dashoffset:-1400}}
.pattern p{font-size:28px;font-weight:500;max-width:760px;line-height:1.35}
.pill{display:inline-flex;align-items:center;gap:12px;border-radius:999px;padding:12px 28px;font-size:22px;font-weight:600;line-height:1.3;background:var(--black);color:var(--white);max-width:860px;flex:none}
.pill::before{flex:none}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--orange)}

/* stats */
#s3 .cards{grid-template-columns:repeat(4,1fr);margin-top:48px}
#s3 .card .t{font-size:23px}
.stat{font-size:80px;font-weight:500;letter-spacing:-.04em;line-height:1;color:var(--black);font-variant-numeric:tabular-nums}
.stat small{font-size:.5em;letter-spacing:-.01em;margin-right:8px}
.bars{display:flex;gap:18px;align-items:flex-end;margin-top:4px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.bar b{display:block;border-radius:8px 8px 0 0;background:var(--gclaro);height:var(--h);transform-origin:bottom}
.bar.now b{background:var(--orange)}
.in .bar b{animation:grow 1.4s var(--ease) var(--d,.6s) both}
@keyframes grow{from{transform:scaleY(0)}}
.bar span{font-size:17px;color:var(--grafite);display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
.source{margin-top:auto;font-size:20px;font-weight:300;color:var(--sub-l)}

/* cycle */
#s4 .lead{max-width:1250px}
.cycle{position:relative;margin-top:72px}
.cycle .line{position:absolute;left:114px;right:114px;top:56px;height:2px;background:linear-gradient(90deg,rgba(201,209,222,.15),rgba(201,209,222,.4),rgba(255,91,0,.6))}
.cycle .bead{position:absolute;left:114px;top:51px;width:12px;height:12px;border-radius:50%;background:var(--orange);box-shadow:0 0 14px 3px rgba(255,91,0,.85);opacity:0}
.in .cycle .bead{animation:beadMove 4.8s cubic-bezier(.45,0,.55,1) 2.2s infinite}
@keyframes beadMove{0%{transform:translateX(0);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translateX(1372px);opacity:0}}
.stages{display:grid;grid-template-columns:repeat(7,1fr);position:relative}
.stage-i{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.moon{width:112px;height:112px;border-radius:50%;position:relative;overflow:hidden;background:radial-gradient(circle at 36% 30%,#fff 0%,#e4e4e4 45%,#8d8d8d 100%);margin-bottom:14px}
.moon .m{position:absolute;inset:-1px;border-radius:50%;background:#000;transform:translateX(-170%)}
.in .moon .m{animation:moonTo 1.1s cubic-bezier(.5,0,.15,1) var(--d) forwards}
@keyframes moonTo{to{transform:translateX(var(--x))}}
.moon.total{overflow:visible;background:#000}
.moon.total::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2px rgba(255,200,160,.9),0 0 22px 4px rgba(255,140,60,.75),0 0 70px 14px rgba(255,91,0,.45);opacity:0}
.in .moon.total::after{animation:fade .9s var(--ease) 2s forwards,breath 6s ease-in-out 3s infinite}
@keyframes breath{50%{transform:scale(1.06);opacity:.75}}
.stage-i .n{font-size:20px;font-weight:600;letter-spacing:.2em;color:var(--orange)}
.stage-i h3{font-size:28px;font-weight:600;letter-spacing:-.01em}
.stage-i p{font-size:20px;line-height:1.35;color:var(--gclaro);max-width:200px}
.record{margin-top:44px;align-self:flex-start;display:flex;align-items:center;gap:18px;padding:16px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(20,20,19,.55);font-size:21px;color:var(--gclaro)}
.record b{color:#fff;font-weight:600}
.record i{width:9px;height:9px;border-radius:50%;background:var(--orange);animation:ping 1.8s ease-out infinite}

/* AI */
#s5 .cards{grid-template-columns:1fr 1fr;margin-top:40px}
#s5 .card{padding:32px 34px}
.dots{display:grid;grid-template-columns:repeat(6,32px);gap:14px;margin:6px 0 4px}
.dots i{width:32px;height:32px;border-radius:50%;border:2px solid var(--gclaro);display:block}
.in .dots i{animation:lit .5s var(--ease) var(--d) forwards}
.dots i:first-child{border-color:var(--orange)}
@keyframes lit{to{background:var(--orange);border-color:var(--orange);box-shadow:0 0 14px rgba(255,91,0,.45)}}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto}
.chip{font-size:20px;font-weight:500;padding:8px 20px;border-radius:999px;background:var(--white);color:var(--black);border:1px solid #dfe5ef}
.track{margin-top:6px;border-radius:12px;background:var(--white);border:1px solid #dfe5ef;overflow:hidden}
.track .th{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;font-size:19px;color:var(--grafite);border-bottom:1px solid #e6ebf3}
.track .th b{color:var(--black);font-weight:600}
.badge{font-size:16px;font-weight:600;padding:5px 12px;border-radius:999px;background:#00bc4c;color:#000}
.trow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;padding:15px 22px;border-bottom:1px solid #eef2f8;font-size:21px}
.trow:last-child{border-bottom:none}
.trow .k{font-size:17px;font-weight:600;color:var(--deep);letter-spacing:.08em}
.trow .f{font-size:17px;font-weight:500;padding:5px 14px;border-radius:999px;background:var(--azul);color:var(--grafite)}
.trow .f.prod{background:#fff0e6;color:var(--deep)}
.sample{font-size:17px;color:var(--sub-l);letter-spacing:.04em}

/* results */
#s6 .grid{display:grid;grid-template-columns:1fr 680px;gap:64px;align-items:end}
.chart{position:relative;height:330px;border-radius:16px;background:var(--card-d);box-shadow:inset 0 1px 0 0 rgba(255,255,255,.14);padding:22px}
.chart svg{width:100%;height:100%;overflow:visible}
.chart .grid-l{stroke:rgba(255,255,255,.06)}
.chart .baseline{stroke:var(--gclaro);stroke-width:2;stroke-dasharray:8 8;opacity:.6}
.chart .kpi{fill:none;stroke:var(--orange);stroke-width:4;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:900;filter:drop-shadow(0 0 8px rgba(255,91,0,.55))}
.in .chart .kpi{animation:draw 2.2s var(--ease) .9s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .pt{fill:#000;stroke:var(--orange);stroke-width:3;opacity:0}
.in .chart .pt{animation:fade .5s var(--ease) var(--d) forwards}
.chart text{font-family:var(--sans);font-size:17px;fill:var(--gclaro)}
.chart .tag{position:absolute;right:22px;top:18px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub-d)}
#s6 .cards{grid-template-columns:repeat(4,1fr);margin-top:56px}
#s6 .card{padding:32px 30px}
#s6 .card h3{font-size:27px}
#s6 .card .t{font-size:22px}

/* implementation */
.tl{position:relative;margin-top:84px;height:30px}
.tl .trk{position:absolute;left:0;right:0;top:13px;height:4px;border-radius:4px;background:#e3e8f1}
.tl .fill{position:absolute;left:0;right:0;top:13px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--orange-2),var(--orange),var(--amber));transform-origin:left;transform:scaleX(0)}
.in .tl .fill{animation:fillX 2.6s var(--ease) .5s forwards}
@keyframes fillX{to{transform:scaleX(1)}}
.tl .mk{position:absolute;top:3px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:var(--white);border:3px solid #d5dbe6}
.in .tl .mk{animation:mk .4s var(--ease) var(--d) forwards}
@keyframes mk{to{border-color:var(--orange);background:var(--orange);box-shadow:0 0 0 6px rgba(255,91,0,.15)}}
#s8 .cards{grid-template-columns:repeat(3,1fr);margin-top:40px}
#s8 .card ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:16px}
#s8 .card li{font-size:25px;line-height:1.4;color:var(--grafite);display:flex;gap:16px}
#s8 .card li::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--orange);margin-top:13px}

/* reframe */
#s9 .cards{grid-template-columns:repeat(4,1fr);margin-top:56px}
#s9 .stat{color:var(--orange);font-size:84px}
.clients{margin-top:40px;display:flex;align-items:center;gap:40px}
.clients>p{font-size:22px;color:var(--sub-d);white-space:nowrap}
.clients .marquee{position:relative;bottom:auto;flex:1}
.clients .marquee-track{animation-duration:30s;gap:72px}
.clients .marquee-track span{font-size:34px;font-weight:600;color:#fff;letter-spacing:-.01em}
.clients .marquee-track span::before{width:6px;height:6px;background:var(--grafite);box-shadow:none}
.cocreator{position:absolute;right:160px;top:176px;display:flex;align-items:center;gap:16px;font-size:21px;color:var(--gclaro)}
.cocreator .rf{width:190px;height:29px}

/* demo */
#s10 .total{position:absolute;right:170px;top:50%;width:560px;height:560px;margin-top:-280px}
#s10 .total .disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,#050404 0%,#000 70%)}
#s10 .total .corona{position:absolute;inset:-34%;border-radius:50%;background:radial-gradient(circle,rgba(255,91,0,0) 36%,rgba(255,120,40,.55) 38%,rgba(255,91,0,.22) 46%,rgba(255,91,0,.06) 60%,rgba(255,91,0,0) 70%)}
.in #s10-corona{animation:fade 1.6s var(--ease) .4s both,breath 6s ease-in-out 2s infinite}
#s10 .total .ring{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2px rgba(255,226,204,.95),0 0 18px 3px rgba(255,140,60,.8),0 0 80px 14px rgba(255,91,0,.5)}
#s10 .total .rays{top:50%}
#s10 .orb-ring.r1{inset:-22%}
#s10 .orb-ring.r2{inset:-42%}
#s10 .copy{position:absolute;left:160px;top:170px;width:980px;display:flex;flex-direction:column;gap:30px;color:#fff}

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const slides=$$('.slide'); let cur=0, lang='pt';
const fmt=(n,l)=>{const s=Math.round(n).toString();return s.length<4?s:s.replace(/\B(?=(\d{3})+(?!\d))/g,l==='en'?',':l==='fr'?' ':'.');};
slides.forEach((s,i)=>{const p=s.querySelector('.pg'); if(p) p.textContent=String(i+1).padStart(2,'0');});

/* rays (same generator as the site hero) */
$$('[data-rays]').forEach(box=>{
  let sd=+box.dataset.seed; const rr=()=>(sd=(sd*16807)%2147483647)/2147483647;
  const sc=+box.dataset.scale, full=box.dataset.full; let h='';
  for(let k=0;k<+box.dataset.rays;k++){
    const right=k%2===0;
    const a= full ? rr()*360 : (right? -4+rr()*50 : 184-rr()*50);
    const l=(full? 90+rr()*260 : 200+rr()*560)*sc, o=(full? 285+rr()*10 : rr()*50*sc), w=rr()<.3?2:1.2, op=.45+rr()*.5;
    h+=`<span class="ray" style="--a:${a.toFixed(1)}deg;--l:${l.toFixed(0)}px;--o:${o.toFixed(0)}px;--w:${w}px;--op:${op.toFixed(2)};--d:${(.3+rr()).toFixed(2)}s;--d2:${(2+rr()*4).toFixed(2)}s">${k%3===0?`<i style="--d3:${(1.5+rr()*5).toFixed(2)}s;--t:${(2.6+rr()*2.8).toFixed(2)}s"></i>`:''}</span>`;
  }
  if(!full) for(let k=0;k<5;k++){const a=70+rr()*40,l=(40+rr()*70)*sc;h+=`<span class="ray" style="--a:${a.toFixed(1)}deg;--l:${l.toFixed(0)}px;--o:0px;--w:1px;--op:.35;--d:${(.5+rr()).toFixed(2)}s;--d2:${(rr()*4).toFixed(2)}s"></span>`;}
  box.innerHTML=h;
});

/* pattern field: records -> history -> pattern (sample data) */
const CL=[[140,150],[360,300],[170,460]];
(()=>{let sd=7; const rr=()=>(sd=(sd*16807)%2147483647)/2147483647; let h='';
  for(let r=0;r<11;r++) for(let c=0;c<17;c++){
    const x=40+c*45+(rr()-.5)*22, y=40+r*50+(rr()-.5)*22;
    const near=CL.findIndex(([cx,cy])=>Math.hypot(x-cx,y-cy)<70);
    const d=(.3+rr()*1.6).toFixed(2);
    h+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${near>=0?7:5}"${near>=0?` class="p" style="--d:${d}s;--d2:${(2.4+near*.5+rr()*.3).toFixed(2)}s"`:` style="--d:${d}s"`}></circle>`;
  }
  $('#fieldsvg').innerHTML=h;})();

function render(){
  const D=T[lang];
  document.documentElement.lang=D._lang;
  $$('[data-i]').forEach(el=>{const v=D[el.dataset.i]; if(v==null) return; el.innerHTML=v;});
  $$('[data-list]').forEach(el=>{const items=D[el.dataset.list].map(t=>`<span>${t}</span>`).join(''); el.innerHTML=items+items;});
  $('#trio').innerHTML=D.h_trio.map(([a,b],i)=>`<div data-a="log" style="--d:${(.6+i*.6).toFixed(2)}s"><b>0${i+1}</b><span><h3>${a}</h3><p>${b}</p></span></div>`).join('');
  $('#flabels').innerHTML=D.h_pats.map((t,i)=>{const [x,y]=CL[i]; const left=x/800*100, top=y/600*100; return `<span class="lbl" data-a="log" style="--d:${(2.9+i*.5).toFixed(2)}s;left:calc(${left}% + 78px);top:calc(${top}% - 22px)">${t}</span>`}).join('');
  const vals=[0,20,35,55,62];
  $('#skills').innerHTML=`<div class="row hd2"><span>${D.pr_cols[0]}</span><span>${D.pr_cols[1]}</span><span></span></div>`+D.pr_sk.map((s,i)=>`<div class="row"><span>${s}</span><span class="bar2"><i class="${vals[i]<30?'low':''}" style="--w:${Math.max(vals[i],2)}%;--d:${(1+i*.15).toFixed(2)}s"></i></span><span class="v${vals[i]?'':' none'}">${vals[i]?vals[i]+D.pct:D.pr_none}</span></div>`).join('');
  const xs=[40,440,900,1460];
  $('#msteps').innerHTML=D.ms_steps.map((t,i)=>{const last=i===3; const pos=last?`right:40px;text-align:right;align-items:flex-end`:`left:${40+xs[i]-14}px`; return `<div class="st" data-a="log" style="${pos};--d:${[.9,1.5,2.3,3.2][i]}s"><b>0${i+1}</b><span>${t}</span></div>`}).join('');
  $('#mcards').innerHTML=D.ms_cards.map(([a,b],i)=>`<div class="card" data-a="dash" style="--d:${(.6+i*.12).toFixed(2)}s"><h3>${a}</h3><p class="t">${b}</p></div>`).join('');
  $('#stages').innerHTML=D.y_st.map(([a,b],i)=>{const x=[null,-82,-58,-36,-18,-6,0][i]; const total=i===6;
    return `<div class="stage-i${i===0||i===6?' key':''}" data-a="rise" style="--d:${(.5+i*.14).toFixed(2)}s"><div class="moon${total?' total':''}">${total?'':'<svg class="tex" aria-hidden="true"><use href="#moon-tex"></use></svg><span class="limb"></span>'}${x===null?'':`<i class="m" style="--x:${x}%;--d:${(.9+i*.18).toFixed(2)}s"></i>`}</div><p class="n">0${i+1}</p><h3>${a}</h3><p>${b}</p></div>`}).join('');
  $('#mods').innerHTML=D.pf_mods.map(([a,b,k],i)=>`<div class="card${k?' k':''}" data-a="dash" style="--d:${(.3+i*.1).toFixed(2)}s"><span class="hrow"><span class="ic"><i></i></span><h3>${a}</h3></span><p class="t">${b}</p></div>`).join('');
  $('#phases').innerHTML=D.i_ph.map(([d,t,xs],i)=>`<div class="card${i===2?' hot':''}" data-a="dash" style="--d:${(.6+i*.85).toFixed(2)}s"><p class="n">${d}</p><h3>${t}</h3><ul>${xs.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('');
  $$('[data-money]').forEach(el=>{const v=fmt(+el.dataset.money,lang); el.textContent=lang==='fr'? v+' $ US' : (lang==='en'?'$':'US$ ')+v;});
  $$('[data-count]').forEach(el=>{el.textContent=fmt(+el.dataset.count,lang);});
  const [lg,pv,nx,fs]=D._ui; $('#langs').setAttribute('aria-label',lg); $('#prev').setAttribute('aria-label',pv); $('#next').setAttribute('aria-label',nx); $('#fs').setAttribute('aria-label',fs);
  $$('#langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
}
function countUp(slide){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  $$('[data-count]',slide).forEach(el=>{const to=+el.dataset.count, t0=performance.now()+700, dur=1600;
    const step=t=>{const p=Math.min(1,Math.max(0,(t-t0)/dur)); const e=1-Math.pow(1-p,3); el.textContent=fmt(to*e,lang); if(p<1) requestAnimationFrame(step);};
    el.textContent=fmt(0,lang); requestAnimationFrame(step);});
}
function go(n,replay){
  n=Math.max(0,Math.min(slides.length-1,n));
  if(n===cur && !replay && slides[n].classList.contains('in')) return;
  slides.forEach((s,i)=>{if(i!==n){s.classList.remove('on','in');}});
  const s=slides[n]; s.classList.remove('in'); s.classList.add('on'); void s.offsetWidth; s.classList.add('in');
  cur=n; countUp(s);
  $('#count').textContent=String(n+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
  $('#bar').style.width=((n+1)/slides.length*100)+'%';
  if(location.hash!=='#s'+(n+1)) history.replaceState(null,'','#s'+(n+1));
}
function setLang(l){ if(!T[l]) return; lang=l; try{localStorage.setItem('saros-deck-lang',l);}catch(e){} render(); go(cur,true); }

const stage=$('#stage');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080); stage.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit); fit();

$('#prev').onclick=()=>go(cur-1); $('#next').onclick=()=>go(cur+1);
$$('#langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
$('#fs').onclick=()=>{try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}};
addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1);}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==='Home') go(0); else if(e.key==='End') go(slides.length-1);
  else if(e.key==='f'||e.key==='F') $('#fs').click();
  else if(e.key==='l'||e.key==='L'){const ls=['pt','en','es','fr']; setLang(ls[(ls.indexOf(lang)+1)%4]);}
});
$('#viewport').addEventListener('click',e=>{ if(e.target.closest('a,button')) return; const x=e.clientX/innerWidth; go(x<.3?cur-1:cur+1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(tx==null)return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50) go(dx<0?cur+1:cur-1); tx=null;});
addEventListener('hashchange',()=>{const m=location.hash.match(/^#s(\d+)$/); if(m) go(+m[1]-1);});
let idle; const uis=$$('.ui'); const wake=()=>{uis.forEach(u=>u.classList.remove('hide')); clearTimeout(idle); idle=setTimeout(()=>uis.forEach(u=>u.classList.add('hide')),2600);};
addEventListener('mousemove',wake); addEventListener('keydown',wake); wake();

try{const l=localStorage.getItem('saros-deck-lang'); if(T[l]) lang=l;}catch(e){}
render();
const m0=location.hash.match(/^#s(\d+)$/); go(m0? +m0[1]-1 : 0, true);
</script>
</body>
</html>
